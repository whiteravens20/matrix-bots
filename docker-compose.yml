services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n
      - N8N_PROTOCOL=http
      - N8N_PORT=5678
      - N8N_SECURE_COOKIE=false
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
    volumes:
      - ./n8n/data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  chatbot:
    build: ./chatbot
    container_name: chatbot
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER}
      MATRIX_ACCESS_TOKEN: ${GENERALBOT_ACCESS_TOKEN}
      MATRIX_USER_ID: ${GENERALBOT_USER_ID}
      ALLOWED_USERS: ${GENERALBOT_ALLOWED_USERS}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
    volumes:
      - ./chatbot/data:/app/data
      - ./chatbot/config:/app/config
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  codebot:
    build: ./codebot
    container_name: codebot
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER}
      MATRIX_ACCESS_TOKEN: ${CODEBOT_ACCESS_TOKEN}
      MATRIX_USER_ID: ${CODEBOT_USER_ID}
      ALLOWED_USERS: ${CODEBOT_ALLOWED_USERS}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
    volumes:
      - ./codebot/data:/app/data
      - ./codebot/config:/app/config
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  roombot:
    build: ./roombot
    container_name: roombot
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER}
      MATRIX_ACCESS_TOKEN: ${ROOMBOT_ACCESS_TOKEN}
      MATRIX_USER_ID: ${ROOMBOT_USER_ID}
      TARGET_ROOM_ID: ${TARGET_ROOM_ID}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
    volumes:
      - ./roombot/data:/app/data
      - ./roombot/config:/app/config
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

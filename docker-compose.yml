services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n
      - N8N_PROTOCOL=http
      - N8N_PORT=5678
      - N8N_SECURE_COOKIE=false
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
    volumes:
      - ./n8n/data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dmbot:
    build:
      context: .
      dockerfile: ./dmbot/Dockerfile
    container_name: dmbot
    restart: unless-stopped
    # The image already runs as the distroless nonroot uid (65532), but the
    # bind-mounted data/ directory is owned by the host user. Run as that user
    # so the bot can still write bot-storage.json. Override via .env if your
    # host uid differs.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      n8n:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER}
      # Use either username/password OR access token
      MATRIX_USERNAME: ${DMBOT_USERNAME}
      MATRIX_PASSWORD: ${DMBOT_PASSWORD}
      MATRIX_ACCESS_TOKEN: ${DMBOT_ACCESS_TOKEN}
      ALLOWED_USERS: ${DMBOT_ALLOWED_USERS}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
    volumes:
      - ./dmbot/data:/app/dmbot/data
      - ./dmbot/config:/app/dmbot/config:ro
    # matrix-bot-sdk's SimpleFsStorageProvider rewrites bot-storage.json with a
    # fresh sync token on every /sync response, so its mtime is a real liveness
    # signal — a stalled or wedged sync loop stops touching it. Note the binary
    # is /nodejs/bin/node: distroless has no shell and nothing on PATH.
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "process.exit(Date.now() - require('fs').statSync('/app/dmbot/data/bot-storage.json').mtimeMs < 300000 ? 0 : 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  roombot:
    build:
      context: .
      dockerfile: ./roombot/Dockerfile
    container_name: roombot
    restart: unless-stopped
    # See the dmbot service for why this is pinned to the host uid.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      n8n:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER}
      # Use either username/password OR access token
      MATRIX_USERNAME: ${ROOMBOT_USERNAME}
      MATRIX_PASSWORD: ${ROOMBOT_PASSWORD}
      MATRIX_ACCESS_TOKEN: ${ROOMBOT_ACCESS_TOKEN}
      TARGET_ROOM_ID: ${TARGET_ROOM_ID}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
    volumes:
      - ./roombot/data:/app/roombot/data
      - ./roombot/config:/app/roombot/config:ro
    # See the dmbot service for why this checks bot-storage.json's mtime.
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "process.exit(Date.now() - require('fs').statSync('/app/roombot/data/bot-storage.json').mtimeMs < 300000 ? 0 : 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.bot }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bot: [dmbot, roombot]
        node: ['22']

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.bot }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.bot }}
        run: npm ci --ignore-scripts

      - name: Run bot tests
        working-directory: ${{ matrix.bot }}
        run: npm test

      - name: Syntax check (node --check)
        working-directory: ${{ matrix.bot }}
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print | xargs -r -n1 node --check

  shared-tests:
    name: Test (shared, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22']

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: dmbot/package-lock.json

      - name: Install vitest (via dmbot)
        working-directory: dmbot
        run: npm ci --ignore-scripts

      - name: Run shared tests
        working-directory: dmbot
        run: npx vitest run --dir ../shared/tests

  docker-build:
    name: Validate Docker build (${{ matrix.bot }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        bot: [dmbot, roombot]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (load locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          dockerfile: ./${{ matrix.bot }}/Dockerfile
          push: false
          load: true
          tags: matrix-bots-${{ matrix.bot }}:ci
          cache-from: type=gha,scope=${{ matrix.bot }}
          cache-to: type=gha,mode=max,scope=${{ matrix.bot }}

      # Scan the built image now so HIGH/CRITICAL CVEs in OS or bundled tools
      # surface on the PR — not at release time.
      - name: Trivy image scan (${{ matrix.bot }})
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: matrix-bots-${{ matrix.bot }}:ci
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: '1'
          format: sarif
          output: trivy-image-${{ matrix.bot }}.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-${{ matrix.bot }}.sarif
          category: trivy-image-${{ matrix.bot }}

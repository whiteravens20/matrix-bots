name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.bot }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bot: [dmbot, roombot]
        node: ['24']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.bot }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.bot }}
        run: npm ci --ignore-scripts

      - name: Run bot tests
        working-directory: ${{ matrix.bot }}
        run: npm test

      - name: Syntax check (node --check)
        working-directory: ${{ matrix.bot }}
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print | xargs -r -n1 node --check

  shared-tests:
    name: Test (shared, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: dmbot/package-lock.json

      - name: Install vitest (via dmbot)
        working-directory: dmbot
        run: npm ci --ignore-scripts

      - name: Run shared tests
        working-directory: dmbot
        run: npx vitest run --dir ../shared/tests

  docker-build:
    name: Validate Docker build (${{ matrix.bot }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        bot: [dmbot, roombot]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (load locally)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./${{ matrix.bot }}/Dockerfile
          push: false
          load: true
          tags: matrix-bots-${{ matrix.bot }}:ci
          cache-from: type=gha,scope=${{ matrix.bot }}
          cache-to: type=gha,mode=max,scope=${{ matrix.bot }}

      # Scan the built image now so HIGH/CRITICAL CVEs in OS or bundled tools
      # surface on the PR — not at release time.
      #
      # `severity` only gates the exit code. Without `limit-severities-for-sarif`
      # Trivy writes *every* severity into the SARIF, so the unfixable LOW/MEDIUM
      # distroless base CVEs flood the Security tab. Keep it in sync with the
      # `trivy-fs` job in security.yml, which already sets it.
      - name: Trivy image scan (${{ matrix.bot }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: matrix-bots-${{ matrix.bot }}:ci
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          limit-severities-for-sarif: true
          exit-code: '1'
          format: sarif
          output: trivy-image-${{ matrix.bot }}.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-image-${{ matrix.bot }}.sarif
          category: trivy-image-${{ matrix.bot }}
